[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ops"
version = "2.0.4"
description = "Agent Ops V2.0.4 — Phase 4 30-case eval @ 93.3% (GA gate cleared) + Prompt shelf #2 activated (5 seeds) + factory-harvest CLI (Phase 2 W5 closed)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "openai>=1.40",
  "aiosqlite>=0.20",
  "jinja2>=3.1",
  "sse-starlette>=2.1",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
]

[project.scripts]
# Legacy aliases (kept for backward compatibility)
harness-api = "app.main:run"
harness-initdb = "app.db.init_db:main"
ops-api = "app.main:run"
ops-initdb = "app.db.init_db:main"
# Batch H — `ops` CLI for headless control of a running backend
ops = "app.cli.ops:main"
# V2.0.0 factory CLI — local pipeline runner
factory = "app.cli.factory:main"
# Phase 2 W5 — semi-auto prompt harvest from GitHub sources
factory-harvest = "app.cli.harvest:main"

[tool.setuptools.package-dir]
"" = "backend"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

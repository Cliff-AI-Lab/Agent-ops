tool_id: openai.image.dalle3
version: 0.1.0
name: OpenAI DALL-E 3 图像生成
description: |
  通过 OpenAI API 使用 DALL-E 3 生成图像。支持 1024×1024、1792×1024、1024×1792
  三种分辨率以及 standard / hd 质量。适合海报、插图、占位图、概念图等场景。
provider: OpenAI
category: image_generation
tags: [dalle, creative, prompt-to-image]
input_schema:
  type: object
  required: [prompt]
  properties:
    prompt: { type: string, maxLength: 4000 }
    size:
      type: string
      enum: [1024x1024, 1792x1024, 1024x1792]
      default: 1024x1024
    quality: { type: string, enum: [standard, hd], default: standard }
    style: { type: string, enum: [vivid, natural], default: vivid }
output_schema:
  type: object
  properties:
    image_url: { type: string, format: uri }
    revised_prompt: { type: string }
transport_type: http
endpoint: https://api.openai.com/v1/images/generations
auth_mode: bearer
auth_env_vars: [OPENAI_API_KEY]
pricing_model: per_call
cost_per_call: 0.04
rate_limit_per_minute: 50
expected_latency_ms: 12000
docs_url: https://platform.openai.com/docs/guides/images
examples:
  - title: 生成产品海报
    input: { prompt: "Minimalist Nordic poster of an AI agent orchestrator, isometric, navy + aurora palette", size: "1024x1792", quality: "hd" }
    output_hint: image_url 返回临时可下载 PNG URL(1 小时有效)
activation_status: active

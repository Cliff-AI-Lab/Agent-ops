asset_id: atom.notify.dingtalk.v1
display_id: AT-004
type: atom
layer: L2
subcategory: Notify
version: "1.0.0"
schema_version: "1.0"
name: "钉钉机器人推送"
name_en: "DingTalk Bot Push"
description: |
  钉钉自定义机器人 webhook 推送。
  支持文本 / markdown / actionCard 三种消息类型。
  MVP 期推送内容主用 markdown 表格（不发图，避免 PNG 渲染依赖）。
tags: [dingtalk, notification, webhook, im]
recommend: 推荐
adoption_cost: 低
applicable_scenarios: [团队推送, 周报通知, 告警]
NOT_applicable:
  - 钉钉群图片消息（V2.1 加 chart 原子后启用）
  - 钉钉私聊
  - 飞书 / 企业微信（用各自专属原子）
maintainer: "TBD / 2026-05"
io_schema:
  inputs:
    type: object
    required: [webhook_url, message_type, content]
    properties:
      webhook_url: { type: string }
      message_type: { enum: [text, markdown, actionCard], default: markdown }
      content: { type: string, x-data-type: markdown_text }
      title: { type: string, default: "" }
      at_mobiles: { type: array, default: [] }
  outputs:
    type: object
    properties:
      output: { type: object }
      message_id: { type: string }
projections:
  dify:
    compatible_dify_version: ">=0.4.0"
    node_type: http-request
    # Jinja2 -> YAML mapping; rendered into node.data block.
    # DingTalk webhook is invoked via Dify's http-request node. The webhook
    # token must be configured in Dify's environment_variables (do not inline
    # secrets). Default msgtype is markdown because text gets truncated.
    template: |
      type: http-request
      title: {{ atom.name | tojson }}
      desc: {{ (node.selection_reason or '')[:200] | tojson }}
      selected: false
      method: POST
      url: {{ (node.params.get('webhook_url') or '${DINGTALK_WEBHOOK_URL}') | tojson }}
      headers: |-
        Content-Type: application/json
      params: ""
      body:
        type: json
        data:
          - key: msgtype
            type: text
            value: markdown
          - key: markdown
            type: object
            value:
              title: {{ (node.params.get('title') or '工厂日报') | tojson }}
              text: {{ (node.params.get('text') or '${content}') | tojson }}
      timeout:
        max_connect_timeout: 5
        max_read_timeout: 10
        max_write_timeout: 5
      authorization:
        type: no-auth
        config: null
      variables: []
  n8n:
    compatible_n8n_version: ">=1.0"
    node_type: n8n-nodes-base.httpRequest
    template: "# Phase 5"
test_cases:
  - name: "happy - markdown push"
    inputs:
      webhook_url: "${TEST_DINGTALK_WEBHOOK}"
      message_type: markdown
      content: "# 测试\n| a | b |\n|---|---|\n| 1 | 2 |"
      title: "test"
    expected_output_match: { message_id: "any" }
  - name: "edge - invalid webhook"
    inputs:
      webhook_url: "https://invalid.example.com/robot"
      message_type: text
      content: "x"
    expected_error_class: "WebhookError"
metrics: { cost_per_call_cny: 0 }
provenance:
  built_at: "2026-05-01T00:00:00Z"
  built_by: manual

# ES-001: MVP 智能日报/周报场景评测集
# Phase 4 验收基线：MVP ≥70% / GA ≥80%
# 用例覆盖：单源/多源/异常输入/不同触发器
# 检查方式：loose 结构性断言（target/subcategories/node-count/validator-ok）

asset_id: ES-001
version: "1.0.0"
description: |
  MVP 智能日报/周报场景的 10 个评测用例。覆盖 cron 触发、单数据源、Notify
  渠道差异、异常 NL 鲁棒性。以 LLM 输出会有变动，故仅做结构性断言。
maintainer: "TBD / 2026-05"

cases:
  # ------ 单数据源 + 简单分析 ------
  - case_id: c01-cron-db-llm-dingtalk
    description: 标准 MVP 场景：cron + DB + LLM + 钉钉
    nl: 每周一上午 9 点查询销售数据库，写中文周报推到钉钉运营群
    expected:
      target: hybrid
      subcategories: [DB, LLM, Notify]
      min_nodes: 3
      require_validator_ok: true
    tags: [mvp, cron, single-source]

  - case_id: c02-daily-order-summary
    description: 每日订单汇总到邮件（n8n 主，可能不含 LLM）
    nl: 每天上午 8 点把昨日订单量从订单库取出，发邮件给运营
    expected:
      subcategories: [DB]
      min_nodes: 2
      require_validator_ok: true
    tags: [mvp, daily, db]

  - case_id: c03-http-source-report
    description: 数据源是外部 HTTP API
    nl: 每周拉取我们 CRM API 上周新增客户列表，分析签约金额 Top10，发钉钉
    expected:
      subcategories: [HTTP, LLM, Notify]
      min_nodes: 3
      require_validator_ok: true
    tags: [mvp, http-source]

  # ------ 不同触发器 ------
  - case_id: c04-webhook-trigger
    description: webhook 触发的实时分析
    nl: 当客服系统 webhook 推过来一条投诉，调 LLM 分析严重程度并分级推钉钉
    expected:
      subcategories: [LLM, Notify]
      min_nodes: 2
      require_validator_ok: true
    tags: [mvp, webhook]

  - case_id: c05-monthly-report
    description: 月度报表
    nl: 每月最后一天 18 点，从销售库取本月数据，生成月报推钉钉
    expected:
      target: hybrid
      subcategories: [DB, LLM, Notify]
      min_nodes: 3
      require_validator_ok: true
    tags: [mvp, monthly]

  # ------ 不同 Notify 渠道 ------
  - case_id: c06-multi-notify-channel
    description: 同时推钉钉 + 飞书
    nl: 每周一查询销售数据，生成周报，同时发钉钉和飞书运营群
    expected:
      subcategories: [DB, LLM, Notify]
      min_nodes: 3
      require_validator_ok: true
    tags: [mvp, multi-notify]

  # ------ 异常输入鲁棒性 ------
  - case_id: c07-vague-input
    description: 含糊需求（缺时间表达、缺数据源）—— 期望工厂诚实报告 no_candidate 而非崩溃
    nl: 帮我做一个销售报表
    expected:
      min_nodes: 1
      require_validator_ok: true
      allowed_issue_kinds: [type_adapters_needed, no_candidate]
    tags: [mvp, edge, vague]

  - case_id: c08-non-mvp-domain
    description: 非 MVP 场景（语音）—— 应该报告缺原子但不应崩溃
    nl: 把这段录音转成文字然后总结
    expected:
      min_nodes: 1
      allowed_issue_kinds: [type_adapters_needed, no_candidate]
    tags: [mvp, edge, gap]

  # ------ 业务变体 ------
  - case_id: c09-trend-analysis
    description: 趋势分析（多 LLM 步骤）
    nl: 每周一从销售库取上周数据，用 LLM 找出客户购买趋势异常，写洞察报告发钉钉
    expected:
      subcategories: [DB, LLM, Notify]
      min_nodes: 3
      require_validator_ok: true
    tags: [mvp, analysis]

  - case_id: c10-event-driven
    description: 事件驱动（订单异常时触发）
    nl: 当订单库出现金额超过 100 万的异常订单，立即用 LLM 评估风险并推钉钉
    expected:
      subcategories: [DB, LLM, Notify]
      min_nodes: 3
      require_validator_ok: true
    tags: [mvp, event]

  # ------ 扩展 W2 → W3：边界与多变体 ------

  - case_id: c11-very-short-nl
    description: 极简 NL—— 只给一个动词 + 一个名词
    nl: 推送销售数据
    expected:
      min_nodes: 1
      allowed_issue_kinds: [type_adapters_needed, no_candidate]
    tags: [mvp, edge, terse]

  - case_id: c12-multi-source-future
    description: 多数据源（V2.0.6 才支持，当前预期 type_adapters_needed）
    nl: 每周一从销售库 + 客服系统 webhook 同时取数据，合并分析后发钉钉
    expected:
      subcategories: [DB, HTTP, LLM, Notify]
      min_nodes: 4
      allowed_issue_kinds: [type_adapters_needed, no_candidate]
    tags: [mvp, edge, multi-source]

  - case_id: c13-english-nl
    description: 英文需求（验证 IntentParser 多语言鲁棒）
    nl: Every Monday at 9am query sales database, write a Chinese weekly report, push to DingTalk
    expected:
      subcategories: [DB, LLM, Notify]
      min_nodes: 3
      require_validator_ok: true
    tags: [mvp, edge, en]

  - case_id: c14-very-precise-time
    description: 精确时间表达（cron 解析挑战）
    nl: 每月最后一个工作日下午 5 点 30 分查销售库，发月报到钉钉
    expected:
      subcategories: [DB, LLM, Notify]
      min_nodes: 3
      require_validator_ok: true
    tags: [mvp, edge, cron-complex]

  - case_id: c15-output-format-variation
    description: 输出格式变化（短摘要而非完整周报）
    nl: 每天上午 9 点拉昨日订单总数，发一句话摘要到钉钉
    expected:
      subcategories: [DB, LLM, Notify]
      min_nodes: 3
      require_validator_ok: true
    tags: [mvp, variant, summary]

  # ------ W3 → 30 用例 GA 验收前置：行业变体 + 模式变体 + 压力 ------

  - case_id: c16-industry-hr
    description: HR 行业 - 简历库筛选
    nl: 每天早上从 HR 数据库查 24 小时内新简历，挑符合岗位关键词的发钉钉给招聘经理
    expected:
      subcategories: [DB, LLM, Notify]
      min_nodes: 3
      require_validator_ok: true
    tags: [industry, hr]

  - case_id: c17-industry-finance
    description: 金融行业 - 风控告警
    nl: 每小时查交易库找出金额异常订单，AI 判定风险等级超过 3 级时立即推钉钉风控群
    expected:
      subcategories: [DB, LLM, Notify]
      min_nodes: 3
      require_validator_ok: true
    tags: [industry, finance]

  - case_id: c18-industry-edu
    description: 教育行业 - 学情简报
    nl: 每周日晚上 8 点拉教学库本周作业完成数据，生成学情简报推钉钉教师群
    expected:
      subcategories: [DB, LLM, Notify]
      min_nodes: 3
      require_validator_ok: true
    tags: [industry, edu]

  - case_id: c19-industry-ops
    description: 运维 - 服务健康巡检
    nl: 每 30 分钟拉一次监控 API 检查所有服务状态，发现异常用 LLM 总结并推钉钉运维群
    expected:
      subcategories: [HTTP, LLM, Notify]
      min_nodes: 3
      require_validator_ok: true
    tags: [industry, ops]

  - case_id: c20-industry-marketing
    description: 营销 - 竞品监控（web scraping 不在 MVP 原子集，预期 no_candidate）
    nl: 每天上午 10 点抓取竞品官网新动态，AI 分析后写日报推钉钉市场部
    expected:
      subcategories: [HTTP, LLM, Notify]
      min_nodes: 3
      allowed_issue_kinds: [type_adapters_needed, no_candidate]
    tags: [industry, marketing]

  # ------ 模式变体 ------

  - case_id: c21-multi-step-analysis
    description: 多步 LLM 分析（先分类再总结）
    nl: 每天拉客服工单库，先用 LLM 给工单分类，再为每类生成中文摘要，统一推钉钉
    expected:
      subcategories: [DB, LLM, Notify]
      min_nodes: 4
      require_validator_ok: true
    tags: [pattern, multi-step]

  - case_id: c22-no-trigger
    description: 无触发器（一次性 / 即时执行）
    nl: 现在立即查销售库前 100 单，AI 总结发钉钉
    expected:
      subcategories: [DB, LLM, Notify]
      min_nodes: 3
      require_validator_ok: true
    tags: [pattern, manual]

  - case_id: c23-multiple-recipients
    description: 多收件人推送（不同人收不同内容）
    nl: 每天 9 点查销售库，给老板推钉钉摘要，给销售总监推完整明细
    expected:
      subcategories: [DB, LLM, Notify]
      min_nodes: 4
      require_validator_ok: true
    tags: [pattern, fanout]

  - case_id: c24-conditional-notify
    description: 条件推送（满足条件才发）。LLM 非必需—— Resolver 不过度使用 LLM 是合理选择
    nl: 每小时检查订单库，只有当过去一小时新单超过 50 才发钉钉告警
    expected:
      subcategories: [DB, Notify]
      min_nodes: 3
      require_validator_ok: true
    tags: [pattern, conditional]

  - case_id: c25-data-enrichment
    description: 数据补全（DB + 外部 API 联合）
    nl: 每周一查销售库 top 10 客户，调外部公司信息 API 补全工商数据，生成报告发钉钉
    expected:
      subcategories: [DB, HTTP, LLM, Notify]
      min_nodes: 4
      require_validator_ok: true
    tags: [pattern, enrichment]

  # ------ 压力 / 边界 ------

  - case_id: c26-very-long-nl
    description: 极长 NL（200+ 字符的复杂需求）
    nl: 每周一上午 9 点准时从公司 PostgreSQL 销售数据库查询上一周完整交易明细，按客户维度做汇总，找出环比变化最大的前 10 个 VIP 客户，由 AI 分析其购买模式变化、潜在流失风险、加购建议，生成结构化中文周报包含执行摘要、客户排名表、趋势图说明、行动建议四个部分，最后推送到钉钉运营总群让全员同步
    expected:
      subcategories: [DB, LLM, Notify]
      min_nodes: 3
      require_validator_ok: true
    tags: [edge, long-nl]

  - case_id: c27-typo-tolerant
    description: 含错别字（"销骁"代替"销售"）
    nl: 每周一查销骁库写周报推钉钉
    expected:
      min_nodes: 1
      allowed_issue_kinds: [type_adapters_needed, no_candidate, low_confidence]
    tags: [edge, typo]

  - case_id: c28-conflicting-channels
    description: 冲突表达（说邮箱但又说钉钉）
    nl: 每天查销售库，发邮件给老板，啊不对发钉钉
    expected:
      subcategories: [DB, LLM, Notify]
      min_nodes: 3
      allowed_issue_kinds: [type_adapters_needed]
    tags: [edge, conflict]

  - case_id: c29-minimal-info
    description: 信息最小化（只说要做什么）
    nl: 做销售周报
    expected:
      min_nodes: 1
      allowed_issue_kinds: [type_adapters_needed, no_candidate, low_confidence]
    tags: [edge, minimal]

  - case_id: c30-implicit-schedule
    description: 隐含触发时间（"每周"无明确时间点）
    nl: 每周从销售库查上周数据，让 AI 写中文周报推钉钉运营群
    expected:
      subcategories: [DB, LLM, Notify]
      min_nodes: 3
      require_validator_ok: true
    tags: [edge, implicit-cron]
